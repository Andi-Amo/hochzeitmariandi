<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Die Website & App zu unserer Hochzeit: RSVP, Sitzplan, Kuchensektion, Fotogalerie und mehr.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hochzeit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Unsere Hochzeit</title>
  <meta name="theme-color" content="#8C6D5C">
  <link rel="manifest" href="manifest.json">
  
  <script>
    let audioElement;
    let countdownAudioElement;
    let audioUnlocked = false;

    function getAudioElement() {
      if (!audioElement) {
        // Flutter web serves pubspec-declared assets under an extra
        // "assets/" prefix, so a pubspec path of "assets/audio/x.ogg" ends
        // up at the URL "assets/assets/audio/x.ogg" (double "assets/").
        audioElement = new Audio('assets/assets/audio/take_me_home.ogg');
      }
      return audioElement;
    }

    function getCountdownAudioElement() {
      if (!countdownAudioElement) {
        countdownAudioElement = new Audio('assets/assets/audio/audioatlant-dominator-action-countdown-trailer-short-1-554634.ogg');
        countdownAudioElement.loop = true;
      }
      return countdownAudioElement;
    }

    // Browsers block audio playback with sound until the page has received a
    // genuine user gesture (click/tap/keydown). Hovering the home button does
    // NOT count as such a gesture, so on a real deployment the music would
    // silently fail to play. To fix this while keeping the hover-triggered
    // "easter egg" behaviour, we prime (play + immediately pause) both audio
    // elements on the very first real interaction with the page. Once the
    // browser has granted the page permission to play audio, later play()
    // calls triggered by hover no longer need a fresh gesture.
    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;

      const unlockOne = (el) => {
        const playPromise = el.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise
            .then(() => {
              el.pause();
              el.currentTime = 0;
            })
            .catch(() => {});
        }
      };

      unlockOne(getAudioElement());
      unlockOne(getCountdownAudioElement());
    }

    ['pointerdown', 'mousedown', 'touchstart', 'touchend', 'keydown', 'click'].forEach((eventName) => {
      // capture: true is essential here — Flutter Web attaches its own
      // listeners on its internal "glass pane" element and calls
      // stopPropagation() on pointer/touch events for its own hit-testing,
      // which would otherwise prevent a bubble-phase listener on `document`
      // from ever firing. Capture-phase listeners on `document` run before
      // the event reaches Flutter's element, so they aren't affected by it.
      document.addEventListener(eventName, unlockAudio, {
        capture: true,
        once: true,
      });
    });

    function playAudio() {
      const el = getAudioElement();
      el.currentTime = 0;
      el.play().catch(err => console.log('Audio play error:', err));
    }
    
    function stopAudio() {
      if (audioElement) {
        audioElement.pause();
        audioElement.currentTime = 0;
      }
    }
    
    function playCountdownSoundLoop() {
      const el = getCountdownAudioElement();
      if (el.paused) {
        el.play().catch(err => console.log('Countdown sound error:', err));
      }
    }
    
    function stopCountdownSound() {
      if (countdownAudioElement) {
        countdownAudioElement.pause();
        countdownAudioElement.currentTime = 0;
      }
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
