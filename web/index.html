<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Die Website & App zu unserer Hochzeit: RSVP, Sitzplan, Kuchensektion, Fotogalerie und mehr.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hochzeit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Unsere Hochzeit</title>
  <meta name="theme-color" content="#8C6D5C">
  <link rel="manifest" href="manifest.json">
  
  <script>
    let audioElement;
    let countdownAudioElement;
    
    function playAudio() {
      if (!audioElement) {
        audioElement = new Audio('assets/audio/take_me_home.ogg');
        audioElement.crossOrigin = 'anonymous';
      }
      audioElement.currentTime = 0;
      audioElement.play().catch(err => console.log('Audio play error:', err));
    }
    
    function stopAudio() {
      if (audioElement) {
        audioElement.pause();
        audioElement.currentTime = 0;
      }
    }
    
    function playCountdownSoundLoop() {
      if (!countdownAudioElement) {
        countdownAudioElement = new Audio('assets/audio/audioatlant-dominator-action-countdown-trailer-short-1-554634.ogg');
        countdownAudioElement.crossOrigin = 'anonymous';
        countdownAudioElement.loop = true;
      }
      if (countdownAudioElement.paused) {
        countdownAudioElement.play().catch(err => console.log('Countdown sound error:', err));
      }
    }
    
    function stopCountdownSound() {
      if (countdownAudioElement) {
        countdownAudioElement.pause();
        countdownAudioElement.currentTime = 0;
      }
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
